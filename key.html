<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enter Access Key</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      text-align: center;
      padding-top: 100px;
    }
    input {
      padding: 10px;
      border: 2px solid #00ff00;
      background: #000;
      color: #00ff00;
      font-size: 18px;
      border-radius: 5px;
      width: 250px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      margin-left: 10px;
      background: #00ff00;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }
    .error {
      color: red;
      margin-top: 15px;
      font-size: 16px;
    }
    .whatsapp-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 25px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Enter Your Access Key</h2>
  <input type="text" id="keyInput" placeholder="Enter Key Here">
  <button onclick="verifyKey()">Submit</button>
  <div class="error" id="errorMsg"></div>
  <a id="whatsappBtn" class="whatsapp-btn" href="#" style="display:none;">Contact on WhatsApp</a>

  <script>
    function verifyKey() {
      const key = document.getElementById('keyInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const whatsappBtn = document.getElementById('whatsappBtn');

      if (key === "HACKERS12232") {
        window.location.href = "terminal.html"; // redirect to hack page
      } else {
        errorMsg.innerText = "❌ Invalid Key! Please buy the correct key to proceed.";
        whatsappBtn.style.display = "inline-block";
        whatsappBtn.href = "https://wa.me/919836942455?text=I%20want%20key";
      }
    }
  </script>
</body>
</html>
