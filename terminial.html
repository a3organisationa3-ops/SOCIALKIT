<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hackers Terminal</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      padding: 20px;
      margin: 0;
      overflow: hidden;
    }
    #terminal {
      background: #111;
      border: 2px solid #00ff00;
      border-radius: 8px;
      padding: 15px;
      height: 70vh;
      overflow-y: auto;
      white-space: pre-wrap;
      box-shadow: 0 0 15px #00ff00;
    }
    #inputArea {
      display: flex;
      margin-top: 15px;
    }
    #inputBox {
      flex: 1;
      padding: 8px;
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      font-size: 16px;
      outline: none;
    }
    .btn {
      padding: 8px 20px;
      margin-left: 10px;
      background: #00ff00;
      border: none;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2 style="color:#00ff00;">Hackers Terminal</h2>
  <div id="terminal">Initializing hack sequence...\n</div>

  <div id="inputArea">
    <input type="text" id="inputBox" placeholder="Enter target info here..." />
    <button class="btn" onclick="startHack()">Start</button>
  </div>

  <script>
    const terminal = document.getElementById('terminal');

    function logToTerminal(text, delay) {
      setTimeout(() => {
        terminal.innerHTML += text + "\n";
        terminal.scrollTop = terminal.scrollHeight;
      }, delay);
    }

    function startHack() {
      const input = document.getElementById('inputBox').value.trim();
      if (!input) {
        logToTerminal("Error: No input detected.", 0);
        return;
      }

      terminal.innerHTML = ""; // clear previous logs

      logToTerminal("[+] Connecting to secure server...", 500);
      logToTerminal("[+] Bypassing firewall protection...", 1500);
      logToTerminal(`[+] Target found: ${input}`, 2500);
      logToTerminal("[+] Deploying advanced exploits...", 3500);
      logToTerminal("[+] Extracting encrypted data...", 5000);
      logToTerminal("[✔] Hack successful! Data retrieved.", 7000);

      // Final funny message
      logToTerminal("Thanks for scam 🤡.....", 9000);
    }
  </script>
</body>
</html>
